name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TURBO_CACHE_DIR: .turbo/cache

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-${{ runner.os }}-node${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

  # Separate job for checking if build artifacts work
  build-check:
    name: Build Artifacts Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-${{ runner.os }}-node22.x-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node22.x-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Verify CLI is executable
        run: |
          cd packages/cli
          node dist/cli.js --help
          node dist/cli.js add --list

      - name: Verify package exports
        run: |
          # Test that packages can be imported
          node -e "const { Document, Page, render } = require('./packages/react/dist/index.cjs'); console.log('✓ @pdfn/react');"
          node -e "const { Tailwind } = require('./packages/tailwind/dist/index.cjs'); console.log('✓ @pdfn/tailwind');"
          node -e "const { pdfn } = require('./packages/vite/dist/index.js'); console.log('✓ @pdfn/vite');"
          node -e "const { withPdfn } = require('./packages/next/dist/index.cjs'); console.log('✓ @pdfn/next');"
          node -e "const core = require('./packages/core/dist/index.cjs'); console.log('✓ @pdfn/core');"
          node -e "const client = require('./packages/client/dist/index.js'); console.log('✓ @pdfn/client');"
